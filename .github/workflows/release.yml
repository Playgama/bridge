name: GitHub Release

# Creates a GitHub release with the bundled SDK attached when a v2+ tag is pushed (v1.x tags are ignored).
# Release notes are auto-generated from commits and can be edited afterwards.

on:
  push:
    tags:
      - 'v[2-9].*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build bundled SDK
        run: npm run build
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/playgama-bridge.js --clobber
          else
            gh release create "$TAG" dist/playgama-bridge.js --title "$TAG" --generate-notes --verify-tag
          fi
